<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metaphors Mein Fasa Hua</title>
<meta name="description" content="एक Engineer की Hindi कविताएँ, प्रकृति की तस्वीरें, दर्शन और जीवन पर कुछ अनकही बातें.">
<meta property="og:title" content="Metaphors Mein Fasa Hua"><meta property="og:description" content="एक Engineer की Hindi कविताएँ, तस्वीरें और दर्शन">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ede0;--paper:#ece2cf;--ink:#2a211b;--soft:#7b6c5c;--line:#d8cab1;--acc:#8c6a43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1rem/1.8 "Hind",sans-serif}
h1,h2,h3,h4,.st,.q,.hero p,.brand{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;font-weight:400}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}[hidden]{display:none!important}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.4rem}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:62rem;margin:0 auto;padding:1.1rem 1.4rem;position:relative}
.brand{font-size:1.15rem}nav{display:flex;gap:1.6rem;align-items:center;font-size:1rem}
nav a{color:var(--soft)}nav a:hover,nav a.on{color:var(--ink)}nav svg{width:20px;height:20px}
.burger{display:none;font-size:1.5rem}
@media(max-width:720px){.burger{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:1rem 1.4rem;border-bottom:1px solid var(--line);z-index:5}nav.open{display:flex}}
.in{animation:in .9s ease both}@keyframes in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.in{animation:none}}
.hero{padding:4.5rem 0 3rem}.hero h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.4;margin:0 0 1.6rem}
.hero p{color:var(--soft);font-size:1.3rem;line-height:1.9;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.btn{display:inline-block;border:1px solid var(--ink);padding:.55rem 1.3rem;transition:.25s}.btn:hover{background:var(--ink);color:var(--bg)}
section{padding:2.6rem 0}h1{font-size:clamp(2rem,6vw,2.8rem);margin:3rem 0 1rem}h2{font-size:clamp(1.6rem,5vw,2.2rem);margin:0 0 1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1.8rem}
.card{display:block;background:var(--paper)}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card div{padding:1.1rem 1.2rem 1.3rem}.card h3{margin:.2rem 0 .5rem;font-size:1.45rem}
.card p{margin:0 0 .7rem;color:var(--soft);font-size:1rem;line-height:1.7}.card span{color:var(--acc)}
small{color:var(--soft)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:center}.feat img{width:100%;display:block}
@media(max-width:720px){.feat{grid-template-columns:1fr}}
.st{font-size:1.45rem;line-height:2;margin:0 0 2rem}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:1.5rem;align-items:center;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:3rem 0}
.duo h3{letter-spacing:.2em;font-size:1.1rem}.duo p{margin:0;color:var(--soft)}.duo b{font-size:2rem;font-weight:400;color:var(--acc)}
.q{font-size:1.5rem;line-height:1.9;text-align:center;margin:2rem 0}
.chips button{padding:.25rem .9rem;border:1px solid var(--line);border-radius:99px;margin:0 .4rem .6rem 0;color:var(--soft)}.chips .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input{width:100%;padding:.7rem 0;background:none;border:0;border-bottom:1px solid var(--line);margin:0 0 1.2rem;font-size:1.1rem}
.poem{max-width:34rem;margin:0 auto;padding-bottom:3rem}.poem h1{margin:1.5rem 0 .3rem}.poem img{width:100%;display:block;margin:2rem 0}
.back{color:var(--soft)}.tags{color:var(--soft);margin:1rem 0}
.share{display:flex;flex-wrap:wrap;gap:.6rem;margin:2rem 0}.share a,.share button{border:1px solid var(--line);padding:.3rem .9rem;border-radius:99px;font-size:.95rem}.share a:hover,.share button:hover{border-color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:1.2rem}
.en{border-left:2px solid var(--line);padding-left:1rem;color:var(--soft);font-style:italic}
details{margin:0 0 1rem}summary{font-size:1.4rem;cursor:pointer;font-family:"Tiro Devanagari Hindi",serif}h4{margin:1rem 0 .2rem;color:var(--soft);font-size:1.05rem}ul{margin:0;padding-left:1.2rem}
.mas{columns:3 14rem;gap:1.2rem}.mas figure{margin:0 0 1.2rem;break-inside:avoid;cursor:zoom-in}.mas img{width:100%;display:block}.mas figcaption{font-size:.95rem;color:var(--soft)}
#lb{position:fixed;inset:0;background:rgba(30,22,16,.95);color:#f4ede0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;z-index:20;padding:1rem;text-align:center}#lb img{max-width:100%;max-height:68vh}#lx{position:absolute;top:1rem;right:1.2rem;font-size:2rem}
#sr{position:fixed;inset:0;background:var(--bg);z-index:30;padding:2rem 1.4rem;overflow:auto}#sr>div{max-width:34rem;margin:0 auto}#sr a{display:block;padding:.5rem 0;border-bottom:1px solid var(--line)}
.th{border-top:1px solid var(--line);padding:2rem 0;max-width:36rem}
footer{margin-top:4rem;padding:3rem 1.4rem;text-align:center;border-top:1px solid var(--line);color:var(--soft)}footer .q{margin-top:0}footer a{margin:0 .6rem}
</style></head><body>
<header class="bar"><a class="brand" href="#/" id="brand"></a><button class="burger" id="bg" aria-label="मेन्यू">☰</button>
<nav id="nav"><a href="#/" data-r="">होम</a><a href="#/poems" data-r="poems">कविताएँ</a><a href="#/photos" data-r="photos">तस्वीरें</a><a href="#/thoughts" data-r="thoughts">विचार</a><a href="#/about" data-r="about">मेरे बारे में</a>
<button id="sb" aria-label="खोजें"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></nav></header>
<div id="sr" hidden><div><button id="sx">बंद करें ✕</button><input id="q" placeholder="खोजें… जैसे: बारिश" autocomplete="off"><div id="res"></div></div></div>
<main class="wrap" id="v"><noscript><p>कृपया JavaScript चालू करें।</p></noscript></main>
<footer id="ft"></footer>
<script>
/* =================================================================
   यहाँ से अपना नाम, कविताएँ, विचार और तस्वीरें बदलें। बाकी कोड को न छुएँ।
   EDIT ONLY THIS BLOCK (until the line "कोड यहाँ से शुरू").
   - date भविष्य की हो तो कविता उसी दिन अपने-आप दिखेगी।
   - draft:true = छिपी रहेगी।  featured:true = "आज की कविता" (सिर्फ़ एक पर)।
   - कविता में "" (खाली) लाइन = नया छंद।
   - तस्वीर: फ़ाइल index.html के साथ उसी जगह upload करें, फिर नाम लिखें: "meri-photo.jpg"
   ================================================================= */
const SITE={name:"आपका नाम",title:"Metaphors Mein Fasa Hua",instagram:"",youtube:"",linkedin:""};

const POEMS=[
 {title:"भीतर रहने लगे लोग",date:"2026-10-03",category:"स्मृतियाँ",images:["poem1.jpg"],featured:true,
  content:["कुछ लोग","हमसे दूर नहीं जाते,","बस हमारे भीतर","रहने लगते हैं।"],english:"",tags:["प्रेम","स्मृति","विरह"]},
 {title:"खिलने की इच्छा",date:"2026-10-01",category:"प्रकृति",images:["poem2.jpg"],
  content:["फूल शायद इसलिए नहीं खिलता","कि कोई उसे देखे,","","वह बस खिलता है","क्योंकि उसके भीतर","खिलने की इच्छा बची होती है।"],tags:["फूल","जीवन"]},
 {title:"रास्तों के बीच",date:"2026-09-25",category:"जीवन",images:["poem3.jpg"],
  content:["कुछ लोग रास्ते नहीं बदलते,","बस रास्तों के बीच","अपना फूल उगा लेते हैं।"],tags:["सफ़र","रास्ते"]}
];

const THOUGHTS=[
 {title:"मशीनें और इंसान",date:"2026-10-02",topic:"मनुष्य",
  content:["मैं मशीनें समझने की कोशिश करता हूँ,","और कविताओं में इंसान को।"]}
];

/* category: फूल, प्रकृति, बारिश, आसमान, पेड़, रास्ते, पुराने स्थान, रात, छोटे-छोटे पल */
const PHOTOS=[
 {src:"poem1.jpg",category:"छोटे-छोटे पल",title:"ठहरा हुआ पल",date:"2026-10-03",caption:"कुछ पल बस महसूस करने के लिए होते हैं.",poem:"भीतर रहने लगे लोग"},
 {src:"poem2.jpg",category:"छोटे-छोटे पल",title:"",date:"2026-10-01",caption:""}
];
/* ================== कोड यहाँ से शुरू — इसे न बदलें ================== */

const $=(s,r=document)=>r.querySelector(s),enc=encodeURIComponent;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10);
const live=a=>a.filter(x=>!x.draft&&(x.date||"")<=today).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
const P=live(POEMS),T=live(THOUGHTS),G=live(PHOTOS);
const fmt=d=>d?new Date(d+"T00:00").toLocaleDateString("hi-IN",{day:"numeric",month:"long",year:"numeric"}):"";
const lines=p=>p.content||[];
const stz=p=>{const o=[[]];lines(p).forEach(l=>l.trim()?o[o.length-1].push(l):o.push([]));return o.filter(s=>s.length)};
const body=p=>stz(p).map(s=>`<p class="st">${s.map(esc).join("<br>")}</p>`).join("");
const imgs=p=>p.images||[];
const ex=p=>p.excerpt||lines(p).filter(l=>l.trim()).slice(0,2).join(" ");
const hay=p=>[p.title,p.category,(p.tags||[]).join(" "),lines(p).join(" ")].join(" ").toLowerCase();
const link=p=>"#/poem/"+enc(p.title);
const pic=(s,a)=>`<img src="${esc(s)}" alt="${esc(a)}" loading="lazy" onerror="this.remove()">`;
const card=p=>`<a class="card" href="${link(p)}">${imgs(p)[0]?pic(imgs(p)[0],p.title):""}<div><small>${fmt(p.date)} · ${esc(p.category)}</small><h3>${esc(p.title)}</h3><p>${esc(ex(p))}</p><span>पढ़ें →</span></div></a>`;
const chips=(cats,c,lab)=>["",...cats].map(k=>`<button class="${k===c?"on":""}" data-k="${esc(k)}">${k?(lab?lab(k):k):"सभी"}</button>`).join("");
const PC=[["फूल","🌸"],["प्रकृति","🌿"],["बारिश","🌧"],["आसमान","🌅"],["पेड़","🌳"],["रास्ते","🛣"],["पुराने स्थान","🏚"],["रात","🌙"],["छोटे-छोटे पल","☕"]];
const V={};

V[""]=()=>{const f=P.find(p=>p.featured)||P[0];
 return `<section class="hero"><h1>मैं पेशे से Engineer हूँ,<br>पर जाने क्यों<br>हर चीज़ में एक कविता ढूँढ लेता हूँ।</h1><p>कभी शब्दों में,<br>कभी फूलों में,<br>कभी बारिश में,<br>और कभी अपने ही भीतर।</p><div class="btns"><a class="btn" href="#/poems">कविताएँ पढ़ें</a><a class="btn" href="#/photos">तस्वीरों में देखें</a></div></section>
 <section><h2>हाल ही में लिखा…</h2><div class="grid">${P.slice(0,6).map(card).join("")}</div></section>
 ${f?`<section class="feat">${imgs(f)[0]?pic(imgs(f)[0],f.title):""}<div><small>आज की कविता</small><h2>${esc(f.title)}</h2>${body(f)}<a class="btn" href="${link(f)}">पूरी कविता →</a></div></section>`:""}
 <section class="duo"><div><h3>ENGINEER</h3><p>Logic<br>Numbers<br>Algorithms<br>Systems<br>Equations</p></div><b>×</b><div><h3>POET</h3><p>Emotions<br>Metaphors<br>Silence<br>Memories<br>Questions</p></div></section>
 <p class="q">शायद मैं दोनों के बीच कहीं हूँ।</p><p class="q"><small>अगर आपके पास थोड़ा समय है, तो बैठिए…<br>कुछ बातें करनी हैं।</small></p>`};

const arch=()=>{const y={};P.forEach(p=>{const a=p.date.split("-");((y[a[0]]=y[a[0]]||{})[a[1]]=(y[a[0]][a[1]]||[])).push(p)});
 return Object.keys(y).sort().reverse().map(a=>`<details open><summary>${a}</summary>${Object.keys(y[a]).sort().reverse().map(m=>`<h4>${new Date(a+"-"+m+"-01T00:00").toLocaleDateString("hi-IN",{month:"long"})}</h4><ul>${y[a][m].map(p=>`<li><a href="${link(p)}">${esc(p.title)}</a></li>`).join("")}</ul>`).join("")}</details>`).join("")};

V.poems=()=>{setTimeout(()=>{let c="",t="";const cats=[...new Set(P.map(p=>p.category))];
 const draw=()=>{$("#ch").innerHTML=chips(cats,c);$("#gr").innerHTML=P.filter(p=>(!c||p.category===c)&&hay(p).includes(t)).map(card).join("")||"<p>कुछ नहीं मिला।</p>"};
 $("#ch").onclick=e=>{const b=e.target.closest("button");if(b){c=b.dataset.k;draw()}};
 $("#f").oninput=e=>{t=e.target.value.trim().toLowerCase();draw()};draw()});
 return `<h1>कविताएँ</h1><input id="f" placeholder="कविताओं में खोजें…"><div class="chips" id="ch"></div><div class="grid" id="gr"></div><section><h2>मेरी डायरी</h2>${arch()}</section>`};

V.poem=title=>{const i=P.findIndex(p=>p.title===title);if(i<0)return V.poems();
 const p=P[i],old=P[i+1],nw=P[i-1],u=location.href,tx=p.title+"\n\n"+lines(p).join("\n")+"\n\n"+u;
 document.title=p.title+" — "+SITE.title;
 setTimeout(()=>{$("#cp").onclick=e=>(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>e.target.textContent="Copy हो गया ✓",()=>prompt("Link copy करें:",u));$("#cd").onclick=()=>makeCard(p)});
 return `<article class="poem"><a class="back" href="#/poems">← सभी कविताएँ</a><h1>${esc(p.title)}</h1><small>${fmt(p.date)} · ${esc(p.category)}</small>${imgs(p).map(s=>pic(s,p.title)).join("")}<div>${body(p)}</div>${p.english?`<p class="en">${esc(p.english).replace(/\n/g,"<br>")}</p>`:""}<p class="tags">${(p.tags||[]).map(t=>"#"+esc(t)).join("  ")}</p>
 <div class="share"><a target="_blank" rel="noopener" href="https://wa.me/?text=${enc(tx)}">WhatsApp</a><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(u)}">Facebook</a><a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${enc(p.title)}&url=${enc(u)}">X</a><button id="cp">Link copy करें</button><button id="cd">Poetry Card बनाएँ</button></div>
 <div class="pager"><span>${old?`<a href="${link(old)}">← ${esc(old.title)}</a>`:""}</span><span>${nw?`<a href="${link(nw)}">${esc(nw.title)} →</a>`:""}</span></div></article>`};

V.photos=()=>{setTimeout(()=>{let c="",cur=[];const lb=$("#lb"),lab=k=>((PC.find(x=>x[0]==k)||["",""])[1])+" "+k;
 const draw=()=>{$("#ch").innerHTML=chips(PC.map(x=>x[0]),c,lab);cur=G.filter(g=>!c||g.category===c);
  $("#ms").innerHTML=cur.map((g,i)=>`<figure data-i="${i}"><img src="${esc(g.src)}" alt="${esc(g.title||g.caption||"")}" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>${esc(g.title||"")}</figcaption></figure>`).join("")||"<p>जल्द ही…</p>"};
 $("#ch").onclick=e=>{const b=e.target.closest("button");if(b){c=b.dataset.k;draw()}};
 $("#ms").onclick=e=>{const f=e.target.closest("figure");if(!f)return;const g=cur[+f.dataset.i];
  $("img",lb).src=g.src;$("div",lb).innerHTML=`<h3>${esc(g.title||"")}</h3><small>${fmt(g.date)}${g.place?" · "+esc(g.place):""}</small><p>${esc(g.caption||"")}</p>${g.poem?`<a class="btn" href="${"#/poem/"+enc(g.poem)}">संबंधित कविता</a>`:""}`;lb.hidden=false};
 lb.onclick=e=>{if(e.target===lb||e.target.id=="lx")lb.hidden=true};draw()});
 return `<h1>तस्वीरों में ठहरी हुई दुनिया</h1><div class="chips" id="ch"></div><div class="mas" id="ms"></div><div id="lb" hidden><button id="lx" aria-label="बंद">×</button><img alt=""><div></div></div>`};

V.thoughts=()=>`<h1>कुछ बातें जो कही नहीं गईं</h1>`+(T.map(t=>`<article class="th"><small>${fmt(t.date)}${t.topic?" · "+esc(t.topic):""}</small><h2>${esc(t.title)}</h2>${body(t)}</article>`).join("")||"<p>जल्द ही…</p>");

V.about=()=>`<h1>मैं कौन हूँ?</h1><p class="q">इस प्रश्न का उत्तर शायद मैं भी खोज ही रहा हूँ।</p><div class="poem"><p>पेशे से मैं Engineer हूँ। पर कविता हमेशा मेरे भीतर की दूसरी भाषा रही है।</p><p>मैं साधारण चीज़ों को ध्यान से देखता हूँ — एक फूल, बारिश की कोई शाम, सुनसान सड़क, किसी की चुप्पी, कोई पुरानी याद। और लिखता हूँ, क्योंकि कुछ भावनाएँ equations से समझाई नहीं जा सकतीं।</p></div><p class="q">दिन में मैं equations solve करता हूँ,<br>रात में उन्हीं equations के बीच<br>इंसान को खोजता हूँ।</p>`;

async function makeCard(p){
 const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
 x.fillStyle="#f4ede0";x.fillRect(0,0,1080,1350);let top=70;
 if(imgs(p)[0]){try{const i=await new Promise((ok,no)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=no;m.src=imgs(p)[0]});
  const h=560,s=Math.max(1080/i.width,h/i.height);x.save();x.beginPath();x.rect(0,0,1080,h);x.clip();x.drawImage(i,(1080-i.width*s)/2,(h-i.height*s)/2,i.width*s,i.height*s);x.restore();top=h+70}catch(e){}}
 try{await document.fonts.load('46px "Tiro Devanagari Hindi"')}catch(e){}
 x.fillStyle="#2a211b";x.textAlign="center";x.font='46px "Tiro Devanagari Hindi",serif';
 lines(p).filter(l=>l.trim()).slice(0,8).forEach((l,k)=>x.fillText(l,540,top+60+k*76,940));
